<div class="card h-100 shadow-sm">

  <img
    class="card-img-top"
    [src]="'/images/' + trip.image"
    [alt]="trip.name"
  />

  <div class="card-body">

    <h5 class="card-title">{{ trip.name }}</h5>

    <p class="card-text">
      <strong>Code:</strong> {{ trip.code }}<br />
      <strong>Length:</strong> {{ trip.length }}<br />
      <strong>Start:</strong> {{ trip.start | date:'shortDate' }}<br />
      <strong>Resort:</strong> {{ trip.resort }}<br />
      <strong>Price:</strong> ${{ trip.perPerson }} per person
    </p>

    <p class="card-text">
      {{ trip.description }}
    </p>

    <button
      class="btn btn-primary"
      type="button"
      [routerLink]="['/edit-trip', trip.code]">
      Edit Trip
    </button>

  </div>

</div>
