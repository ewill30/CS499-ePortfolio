<div class="container mt-4">
  <h1>Travlr Getaways</h1>

  <h2 class="mt-4">Add Trip</h2>

<form #tripForm="ngForm" (ngSubmit)="addTrip()" novalidate>
    <div class="mb-3">
      <label for="code" class="form-label">Code</label>
      <input
        type="text"
        class="form-control"
        id="code"
        name="code"
        [(ngModel)]="newTrip.code"
        required
      />
    </div>

    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input
        type="text"
        class="form-control"
        id="name"
        name="name"
        [(ngModel)]="newTrip.name"
        required
      />
    </div>

    <div class="mb-3">
      <label for="length" class="form-label">Length</label>
      <input
        type="text"
        class="form-control"
        id="length"
        name="length"
        [(ngModel)]="newTrip.length"
        required
      />
    </div>

    <div class="mb-3">
      <label for="start" class="form-label">Start Date</label>
      <input
        type="date"
        class="form-control"
        id="start"
        name="start"
        [(ngModel)]="newTrip.start"
        required
      />
    </div>

    <div class="mb-3">
      <label for="resort" class="form-label">Resort</label>
      <input
        type="text"
        class="form-control"
        id="resort"
        name="resort"
        [(ngModel)]="newTrip.resort"
        required
      />
    </div>

    <div class="mb-3">
      <label for="perPerson" class="form-label">Price Per Person</label>
      <input
    type="number"
    class="form-control"
    id="perPerson"
    name="perPerson"
    [(ngModel)]="newTrip.perPerson"
    min="1"
    required
/>
</div>
    <div class="mb-3">
      <label for="image" class="form-label">Image</label>
      <input
        type="text"
        class="form-control"
        id="image"
        name="image"
        [(ngModel)]="newTrip.image"
        required
      />
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea
        class="form-control"
        id="description"
        name="description"
        [(ngModel)]="newTrip.description"
        required
      ></textarea>
    </div>
<div
  *ngIf="errorMessage"
  class="alert alert-danger"
  role="alert"
>
  {{ errorMessage }}
</div>
    <button
  type="submit"
  class="btn btn-success"
  [disabled]="tripForm.invalid"
>
  Add Trip
</button>

  </form>
</div>
